[project]
name = "smart-coaching"
version = "0.1.0"
description = "Sistem Smart-Coaching Adaptif berbasis NLP untuk kepala sekolah dasar"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"

# Ketergantungan langsung disetujui pada Gerbang 2 fitur 001.
# Penambahan memerlukan persetujuan penanggung jawab teknis (C-12).
# Pembandingnya: ketergantungan-disetujui.toml, ditegakkan `make check`.
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2,<3",
    "pypdf>=6.15.0",
    "pysastrawi>=1.2.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<0.10",
    "mypy>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "perkakas", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Uji memang memuat pernyataan panjang yang menjelaskan sebab kegagalan.
"tests/**" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "perkakas"]
# `strict` inilah yang menegakkan pemisahan tipe Instruksi dan Data (R-06,
# ADR-13): tanpa tipe yang lengkap, penyimpangan baru terlihat saat jalan.
strict = true
warn_unreachable = true

# Catatan atas `disallow_any_explicit`, sempat dipasang pada tugas A-4 lalu
# dicabut pada C-3. Alasan pemasangannya keliru: setelan itu hanya melarang
# kata `Any` ditulis pada kode kita sendiri, dan tidak menambah apa pun pada
# penegakan R-06. Yang ia lakukan adalah menolak `pydantic.BaseModel`, karena
# tanda tangan pydantic sendiri memuat `Any`.
#
# Mempertahankannya menuntut daftar pengecualian per modul yang bertambah
# setiap kali model baru dibuat — dan daftar pengecualian yang bertambah
# adalah tempat pekerjaan bersembunyi, persis yang R-15 dirancang untuk
# mencegah pada `make compliance`. Dicabut, bukan dikecualikan.

# openpyxl tidak menyertakan tanda tipe, dan `strict` menolak impornya.
# Jalan yang disarankan mypy adalah memasang `types-openpyxl` — dan itu
# ketergantungan baru, yang C-12 tuntut disetujui lebih dulu. Setelan di
# bawah menyelesaikannya tanpa menambah paket: ia melonggarkan **satu**
# pustaka, bukan seluruh berkas, sehingga kode kita sendiri tetap diperiksa
# penuh. Tiga pustaka lain (pydantic, pypdf, python-docx) menyertakan
# tandanya dan tidak memerlukan ini.
#
# Sastrawi dan pytesseract sama keadaannya, dan tidak ada paket stub sama
# sekali — bahkan bila C-12 mengizinkannya. Daftar di bawah karena itu
# bukan kelonggaran sementara melainkan pernyataan bahwa kedua pustaka ini
# memang tidak bertanda tipe. Ia bertambah hanya bersama ketergantungan
# baru yang disetujui gerbang, dan setiap barisnya menyebut alasannya.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "Sastrawi.*", "pytesseract.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

# Uji yang menuntut perkakas di luar pohon Python. Ia **dilewati**, tidak
# pernah lulus diam-diam, ketika perkakasnya tidak ada — pembedaan itu yang
# menjaga laporan uji tetap jujur pada lingkungan yang belum lengkap.
markers = [
    "perkakas_luar: menuntut program di luar paket Python, misalnya mesin OCR",
]

# ---------------------------------------------------------------------------

[tool.coverage.run]
# src/ saja. perkakas/ adalah alat bantu pembangunan, bukan modul inti yang
# dinilai TKT 3; memasukkannya membuat angka C-11 dan NFR-16 kehilangan makna.
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
