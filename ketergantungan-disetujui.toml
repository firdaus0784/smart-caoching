# Titik nol ketergantungan — R-18, C-12
#
# Berkas ini adalah rekaman himpunan paket pada saat disetujui manusia,
# bukan turunan otomatis dari uv.lock. Ia menjadi pembanding: tanpa titik
# nol tertulis, "ketergantungan baru" tidak dapat didefinisikan dan R-18
# tidak punya apa-apa untuk dibandingkan.
#
# Disetujui  : Gerbang 2 fitur 001, 2026-08-03
# Pemutus    : pemegang Gerbang 1-4 (KM-001; BT-49 masih terbuka)
# Rujukan    : specs/001-kerangka-proyek/plan.md bagian Ketergantungan
#
# Perubahan pada berkas ini adalah keputusan tim, bukan keputusan agen.
# Menambah baris di sini untuk meloloskan `make check` membatalkan gunanya.

# Lima ketergantungan langsung yang disetujui secara sadar pada Gerbang 2.
langsung = [
    "pydantic",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    # Ditambahkan Gerbang 1 fitur 015, keputusan KB-017. Lisensi diperiksa
    # langsung ke PyPI pada 6 Agustus 2026, bukan dikutip dari ingatan.
    "pypdf",        # BSD-3-Clause
    "python-docx",  # MIT
    "openpyxl",     # MIT
    "PySastrawi",   # MIT
    "pytesseract",  # Apache-2.0
    # Ditambahkan atas keputusan KB-044 (13 Agustus 2026). Lisensi diperiksa
    # langsung ke PyPI pada 12 Agustus 2026, bukan dikutip dari ingatan.
    "fastapi",      # MIT
    "uvicorn",      # BSD-3-Clause
    "httpx",        # BSD-3-Clause
    "asyncpg",      # Apache-2.0
    "pgvector",     # MIT
    # Ditambahkan atas keputusan KB-083 (12 September 2026) bagi fitur 019.
    # Lisensi dibaca langsung dari API PyPI pada 3 September 2026.
    "torch",                  # Apache-2.0 AND Apache-2.0 WITH LLVM-exception
                              # AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT
    "transformers",           # Apache-2.0
    "sentence-transformers",  # Apache-2.0
]

