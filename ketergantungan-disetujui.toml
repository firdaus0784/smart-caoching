#
# Berkas ini adalah rekaman himpunan paket pada saat disetujui manusia,
# bukan turunan otomatis dari uv.lock. Ia menjadi pembanding: tanpa titik
# nol tertulis, "ketergantungan baru" tidak dapat didefinisikan dan R-18
# tidak punya apa-apa untuk dibandingkan.
#
# Disetujui  : Gerbang 2 fitur 001, 2026-08-03
