# Ekstensi pgvector pada peladen PostgreSQL — fitur 019, keputusan KB-093.
#
# **Bukan paket Python.** Paket Python `pgvector` sudah ada pada daftar
# `langsung` (KB-083) dan hanya menyediakan tipe bagi `asyncpg`; ia tidak
# dapat menyimpan satu vektor pun tanpa ekstensi ini terpasang pada
# peladennya. Keduanya wajib ada, dan keduanya dicatat terpisah karena
# dipasang orang yang berbeda dengan perintah yang berbeda.
#
# Pemasangannya pekerjaan operasi (D-09), bukan `make setup`:
#
#     apt-get install postgresql-16-pgvector    # atau setara distribusinya
#     psql -d smart_coaching -c 'CREATE EXTENSION vector'
#
# `versi` diisi versi yang benar-benar dipakai menjalankan uji, bukan versi
# yang diharapkan — sejajar [sistem.label_studio] dan berbeda dari
# [sistem.tesseract] yang sengaja kosong.
[sistem.pgvector]
versi = "0.6.0"
paket = "postgresql-16-pgvector"
versi_peladen = "PostgreSQL 16.13"
lisensi = "PostgreSQL"
diperiksa = "20 September 2026"

# Label Studio — R-13 fitur 016, keputusan KB-020 dan KB-025.
#
# **Bukan paket Python.** KB-020 menolaknya sebagai ketergantungan proyek:
# kode kita tidak mengimpornya, tidak memanggilnya, hanya membaca berkas
# ekspornya. Yang dicatat di sini karena itu bukan versi yang terpasang pada
# lingkungan ini — tidak ada yang terpasang — melainkan **versi yang
# menghasilkan bahan uji acuan**, dan sidik bahan itu.
#
# Yang dijaga pemeriksa: bahan uji tidak berubah diam-diam. Ia satu-satunya
# bukti tentang bentuk ekspor Label Studio yang dimiliki proyek ini, dan
# seluruh uji `impor_ls` bersandar padanya. Bahan yang berubah tanpa catatan
# membuat uji yang lulus berhenti membuktikan apa pun.
#
# `versi` TIDAK kosong, berbeda dari [sistem.tesseract]: perangkatnya benar-
# benar dijalankan dan berkasnya benar-benar dihasilkan (KB-023).
[sistem.label_studio]
versi = "1.23.0"
edisi = "Community"
berkas_contoh = "tests/bahan/ekspor-label-studio-1.23.json"
sidik = "sha256:0e8ebeeeafb5aa019c0d5f5daee5694cfd6a98d6cb776d89f0b25ca0adac89cb"
lisensi = "Apache-2.0"
catatan = "sidik berubah sekali pada KB-026; sidik lama tercatat pada logbook/L2"

# ─────────────────────────────────────────────────────────────────────────
# Paket npm bagi `web/` — fitur 027 T-1, persetujuan KB-123 (25 September 2026)
#
# Lisensi dibaca dari registri npm, bukan dari ingatan. Kunci pada
# [npm.terkunci] adalah JALUR di dalam package-lock.json, bukan nama paket:
# satu paket dapat hadir dalam dua versi bersarang, dan kunci nama akan
# membuat keduanya saling menimpa.
#
# Yang ikut ke aplikasi pengguna hanya react, react-dom, dan scheduler —
# ketiganya MIT. Selebihnya alat pengembangan.
#
# Tiga hal yang dicatat pada pemasangan (KB-127):
# - vitest dipatok 5.0.2, bukan 5.0.1 yang dibaca KB-123. npm 10.9.7
#   lingkungan ini macet (`edgesOut`) pada vitest 5.0.0, 5.0.1, dan 4.1.0
#   bersama vite 8.3.1; rilis tambalan 5.0.2 terpasang bersih. Lisensi sama.
# - @testing-library/dom masuk sebagai peer WAJIB @testing-library/react,
#   dipasang otomatis oleh npm. Ia transitif, bukan paket langsung.
# - lightningcss dan sebelas biner platformnya berlisensi MPL-2.0 (copyleft
#   lemah, per berkas). Alat build vite 8 saja; tidak ikut ke aplikasi.
# ─────────────────────────────────────────────────────────────────────────
[npm]
langsung = [
    "react",                   # MIT
    "react-dom",               # MIT
    "typescript",              # Apache-2.0
    "vite",                    # MIT
    "@vitejs/plugin-react",    # MIT
    "vitest",                  # MIT
    "@testing-library/react",  # MIT
    "jsdom",                   # MIT
]

# Pohon utuh package-lock.json saat pemasangan. Selisih apa pun — paket
